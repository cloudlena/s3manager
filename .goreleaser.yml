version: 2

before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
checksum:
  name_template: "checksums.txt"
dockers_v2:
  - images:
      - cloudlena/s3manager
    tags:
      - "{{ .Tag }}"
    dockerfile: Containerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
