services:
  s3manager:
    container_name: s3manager
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - 8080:8080
    environment:
      # S3 Instance 1: my-first-instance
      - S3_1_NAME=my-first-instance
      - S3_1_ENDPOINT=s3:9000
      - S3_1_ACCESS_KEY_ID=s3manager
      - S3_1_SECRET_ACCESS_KEY=s3manager
      - S3_1_USE_SSL=false
      # S3 Instance 2: my-second-instance
      - S3_2_NAME=my-second-instance
      - S3_2_ENDPOINT=s3-2:9000
      - S3_2_ACCESS_KEY_ID=s3manager2
      - S3_2_SECRET_ACCESS_KEY=s3manager2
      - S3_2_USE_SSL=false
    depends_on:
      - s3
      - s3-2
  s3:
    container_name: s3
    image: docker.io/rustfs/rustfs
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - RUSTFS_ACCESS_KEY=s3manager
      - RUSTFS_SECRET_KEY=s3manager
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
  s3-2:
    container_name: s3-2
    image: docker.io/rustfs/rustfs
    ports:
      - 9002:9000
      - 9003:9001
    environment:
      - RUSTFS_ACCESS_KEY=s3manager2
      - RUSTFS_SECRET_KEY=s3manager2
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
